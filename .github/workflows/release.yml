name: Release

# Push a tag that matches manifest.json's version (e.g. 0.1.0 or v0.1.0)
# to publish a GitHub release with theme.css and manifest.json attached.
on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the manifest version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(jq -r .version manifest.json)"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest.json version $version"
            exit 1
          fi

      - name: Check theme.css is up to date with src/
        run: |
          python3 scripts/build.py
          git diff --exit-code -- theme.css || {
            echo "::error::theme.css is stale. Run python3 scripts/build.py and commit."
            exit 1
          }

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" theme.css manifest.json \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
